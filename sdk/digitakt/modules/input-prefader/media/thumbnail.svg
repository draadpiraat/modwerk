<svg xmlns="http://www.w3.org/2000/svg" width="320" height="192" viewBox="0 0 320 192" class="signal-art" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-labelledby="title description">
<title id="title">Input Pre-Fader Sends</title>
<desc id="description">The external inputs split before their level fader: the main path runs through LEV to the mains, the send path goes straight to the delay and reverb. The stock post-fader tap is shown faint. Original conceptual illustration, not an instrument screen or a measured result.</desc>
